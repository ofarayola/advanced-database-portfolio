# CarePoint replica set rs0 - node 2
# Start with:  mongod --config config\node2.conf
storage:
  dbPath: C:/data/rs0/node2          # data files (kept OUTSIDE the Git repo)
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.25               # small memory cache: 3 nodes share one PC
systemLog:
  destination: file
  path: C:/data/rs0/logs/node2.log   # log file, so the terminal stays quiet
  logAppend: true
net:
  port: 27019                         # each node needs its own port
  bindIp: 127.0.0.1                   # local only (see P5 README, security)
replication:
  replSetName: rs0                    # same name on all 3 nodes = one replica set